name: Native packages
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm ci
        working-directory: vscode-extension
      - run: npm test
        working-directory: vscode-extension
      - run: npm run package
        working-directory: vscode-extension
      - run: node ../vscode-extension/node_modules/@vscode/vsce/vsce package --no-dependencies --skip-license -o p2-ppsspp-host.vsix
        working-directory: vscode-ppsspp-host
      - run: npm run package:exe
        env:
          P2_EXE_TARGET: ${{ runner.os == 'Windows' && 'node22-win-x64' || 'node22-linux-x64' }}
      - run: node scripts/test-exe.js
        env:
          P2_EXE_TARGET: ${{ runner.os == 'Windows' && 'node22-win-x64' || 'node22-linux-x64' }}
      - run: python scripts/archive-native.py
        env:
          P2_EXE_TARGET: ${{ runner.os == 'Windows' && 'node22-win-x64' || 'node22-linux-x64' }}
      - uses: actions/upload-artifact@v4
        with:
          name: p2-tool-${{ runner.os }}-${{ runner.arch }}
          path: release/Persona2Tool-${{ runner.os }}-x64.zip
          include-hidden-files: true
